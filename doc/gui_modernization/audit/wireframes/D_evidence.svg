<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="740" viewBox="0 0 1280 740">
<rect width="1280" height="740" fill="#e9edf2"/>
<g font-family="Segoe UI">
<rect x="0" y="0" width="1280" height="70" fill="#d4dbe4"/>
<text x="22" y="29" font-size="20" font-weight="bold" fill="#334155">SignalLens Forensic Workbench</text>
<text x="22" y="53" font-size="13" font-weight="normal" fill="#334155">PROPOSED STATIC WIREFRAME • illustrative labels • no functioning replacement</text>
<text x="205" y="101" font-size="19" font-weight="bold" fill="#334155">D — Evidence Explorer</text>
<rect x="12" y="85" width="170" height="590" rx="4" fill="#f4f6f9" stroke="#8995a6"/>
<text x="32" y="128" font-size="14" font-weight="normal" fill="#334155">Overview</text>
<text x="32" y="176" font-size="14" font-weight="normal" fill="#334155">Image Forensics</text>
<rect x="22" y="200" width="150" height="36" rx="3" fill="#d7e0eb" stroke="#64748b"/>
<text x="32" y="224" font-size="14" font-weight="bold" fill="#334155">Evidence</text>
<text x="32" y="272" font-size="14" font-weight="normal" fill="#334155">Reasoning</text>
<text x="32" y="320" font-size="14" font-weight="normal" fill="#334155">Provenance</text>
<text x="32" y="368" font-size="14" font-weight="normal" fill="#334155">Reports</text>
<text x="32" y="615" font-size="13" font-weight="normal" fill="#334155">Settings / Help</text>
<text x="32" y="644" font-size="12" font-weight="normal" fill="#334155">Archive management</text>
<rect x="205" y="122" width="1050" height="65" rx="4" fill="white" stroke="#8995a6"/>
<text x="219" y="149" font-size="15" font-weight="bold" fill="#334155">Filter without changing forensic results</text>
<path d="M219 161 H1241" stroke="#cbd5e1"/>
<text x="219" y="185" font-size="13" font-weight="normal" fill="#334155">Hypothesis [Localized editing v]    Role [All v]    Search [                ]</text>
<rect x="205" y="207" width="680" height="335" rx="4" fill="white" stroke="#8995a6"/>
<text x="219" y="234" font-size="15" font-weight="bold" fill="#334155">Observations · sortable, selectable, copyable</text>
<path d="M219 246 H871" stroke="#cbd5e1"/>
<text x="219" y="270" font-size="13" font-weight="normal" fill="#334155">ROLE          OBSERVATION                    STATUS</text>
<text x="219" y="295" font-size="13" font-weight="normal" fill="#334155">Supporting    [backend label]                 [status]</text>
<text x="219" y="320" font-size="13" font-weight="normal" fill="#334155">Contradicting [backend label, if returned]    [status]</text>
<text x="219" y="345" font-size="13" font-weight="normal" fill="#334155">Moderating    [backend label]                 [status]</text>
<text x="219" y="370" font-size="13" font-weight="normal" fill="#334155">Contextual    [analyst or metadata context]  [status]</text>
<text x="219" y="395" font-size="13" font-weight="normal" fill="#334155"></text>
<text x="219" y="420" font-size="13" font-weight="normal" fill="#334155">Stable evidence IDs; missing values shown as —</text>
<text x="219" y="445" font-size="13" font-weight="normal" fill="#334155">Same observation can have another role for another hypothesis.</text>
<rect x="905" y="207" width="350" height="335" rx="4" fill="white" stroke="#8995a6"/>
<text x="919" y="234" font-size="15" font-weight="bold" fill="#334155">Selected evidence</text>
<path d="M919 246 H1241" stroke="#cbd5e1"/>
<text x="919" y="270" font-size="13" font-weight="normal" fill="#334155">[label + evidence ID]</text>
<text x="919" y="295" font-size="13" font-weight="normal" fill="#334155">Role for selected hypothesis</text>
<text x="919" y="320" font-size="13" font-weight="normal" fill="#334155"></text>
<text x="919" y="345" font-size="13" font-weight="normal" fill="#334155">[backend interpretation]</text>
<text x="919" y="370" font-size="13" font-weight="normal" fill="#334155">[reliability limitation]</text>
<text x="919" y="395" font-size="13" font-weight="normal" fill="#334155"></text>
<text x="919" y="420" font-size="13" font-weight="normal" fill="#334155">Source / detector / artifact</text>
<text x="919" y="445" font-size="13" font-weight="normal" fill="#334155">Open available visualization →</text>
<rect x="205" y="562" width="1050" height="100" rx="4" fill="white" stroke="#8995a6"/>
<text x="219" y="589" font-size="15" font-weight="bold" fill="#334155">Available ancestry / explanation</text>
<path d="M219 601 H1241" stroke="#cbd5e1"/>
<text x="219" y="625" font-size="13" font-weight="normal" fill="#334155">[source measurement IDs] → [derived interpretation]</text>
<text x="219" y="650" font-size="13" font-weight="normal" fill="#334155">Shared ancestry is not independent corroboration. Do not count visible rows as votes.</text>
<rect x="12" y="690" width="1255" height="34" fill="#d4dbe4"/>
<text x="24" y="712" font-size="13" font-weight="normal" fill="#334155">Source: [identity]   Run / revision: [recorded ID]      Execution: [state]      Coverage: [recorded status]</text>
</g></svg>