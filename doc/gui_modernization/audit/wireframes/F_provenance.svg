<text x="32" y="272" font-size="14" font-weight="normal" fill="#334155">Reasoning</text>
<rect x="22" y="296" width="150" height="36" rx="3" fill="#d7e0eb" stroke="#64748b"/>
<text x="32" y="320" font-size="14" font-weight="bold" fill="#334155">Provenance</text>
<text x="32" y="368" font-size="14" font-weight="normal" fill="#334155">Reports</text>
<text x="32" y="615" font-size="13" font-weight="normal" fill="#334155">Settings / Help</text>
<text x="32" y="644" font-size="12" font-weight="normal" fill="#334155">Archive management</text>
<rect x="205" y="122" width="1050" height="110" rx="4" fill="white" stroke="#8995a6"/>
<text x="219" y="149" font-size="15" font-weight="bold" fill="#334155">Provenance state: [backend declaration / missing / ambiguous state]</text>
<path d="M219 161 H1241" stroke="#cbd5e1"/>
<text x="219" y="185" font-size="13" font-weight="normal" fill="#334155">Metadata authenticity: NOT VERIFIED in current backend path</text>
<text x="219" y="210" font-size="13" font-weight="normal" fill="#334155">Presence of C2PA-related metadata is not cryptographic validation.</text>
<rect x="205" y="252" width="650" height="290" rx="4" fill="white" stroke="#8995a6"/>
<text x="219" y="279" font-size="15" font-weight="bold" fill="#334155">Metadata fields and evidence</text>
<path d="M219 291 H841" stroke="#cbd5e1"/>
<text x="219" y="315" font-size="13" font-weight="normal" fill="#334155">TAG / SIGNAL          VALUE                 SOURCE</text>
<text x="219" y="340" font-size="13" font-weight="normal" fill="#334155">[recorded tag]         [recorded value]      [extractor]</text>
<text x="219" y="365" font-size="13" font-weight="normal" fill="#334155">[generation signal]   [if recorded]         [metadata]</text>
<text x="219" y="390" font-size="13" font-weight="normal" fill="#334155">[camera fields]        [if recorded]         [metadata]</text>
<text x="219" y="415" font-size="13" font-weight="normal" fill="#334155"></text>
<text x="219" y="440" font-size="13" font-weight="normal" fill="#334155">Selectable raw values + controlled interpretation</text>
<text x="219" y="465" font-size="13" font-weight="normal" fill="#334155">Missing metadata is not positive synthetic evidence.</text>
<rect x="875" y="252" width="380" height="290" rx="4" fill="white" stroke="#8995a6"/>
<text x="889" y="279" font-size="15" font-weight="bold" fill="#334155">Manual OSINT records</text>
<path d="M889 291 H1241" stroke="#cbd5e1"/>
<text x="889" y="315" font-size="13" font-weight="normal" fill="#334155">Review status: [backend record]</text>
<text x="889" y="340" font-size="13" font-weight="normal" fill="#334155">Provider / URL / first-seen estimate</text>
<text x="889" y="365" font-size="13" font-weight="normal" fill="#334155">Source type / analyst notes</text>
<text x="889" y="390" font-size="13" font-weight="normal" fill="#334155"></text>
<text x="889" y="415" font-size="13" font-weight="normal" fill="#334155">Add / Edit finding</text>
<text x="889" y="440" font-size="13" font-weight="normal" fill="#334155">Open external search provider</text>
<text x="889" y="465" font-size="13" font-weight="normal" fill="#334155"></text>
<text x="889" y="490" font-size="13" font-weight="normal" fill="#334155">No automatic search or upload implied.</text>
<rect x="205" y="562" width="1050" height="100" rx="4" fill="white" stroke="#8995a6"/>
<text x="219" y="589" font-size="15" font-weight="bold" fill="#334155">Interpretive scope / report revision</text>
<path d="M219 601 H1241" stroke="#cbd5e1"/>
<text x="219" y="625" font-size="13" font-weight="normal" fill="#334155">Declarations may support one hypothesis and contextualize another.</text>
<text x="219" y="650" font-size="13" font-weight="normal" fill="#334155">OSINT changes create a visible summary/report revision; analyst input stays attributed.</text>
<rect x="12" y="690" width="1255" height="34" fill="#d4dbe4"/>
<text x="24" y="712" font-size="13" font-weight="normal" fill="#334155">Source: [identity]   Run / revision: [recorded ID]      Execution: [state]      Coverage: [recorded status]</text>
